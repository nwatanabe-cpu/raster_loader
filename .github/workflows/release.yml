name: Release QGIS Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check metadata
        run: |
          echo "Checking metadata.txt..."
          test -f metadata.txt
          grep "^version=" metadata.txt

      - name: Create plugin ZIP
        run: |
          mkdir package
          mkdir package/${{ github.event.repository.name }}

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='package' \
            --exclude='__pycache__' \
            --exclude='.vscode' \
            ./ package/${{ github.event.repository.name }}/

          cd package
          zip -r ../${{ github.event.repository.name }}-${{ github.ref_name }}.zip \
            ${{ github.event.repository.name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.zip