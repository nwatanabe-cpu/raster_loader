name: Release QGIS Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Check metadata
        run: |
          echo "metadata.txt:"
          cat metadata.txt

      - name: Create plugin ZIP
        run: |
          mkdir -p package/${{ github.event.repository.name }}

          cp -r . package/${{ github.event.repository.name }}/

          rm -rf package/${{ github.event.repository.name }}/.git
          rm -rf package/${{ github.event.repository.name }}/.github
          rm -rf package/${{ github.event.repository.name }}/.vscode
          rm -rf package/${{ github.event.repository.name }}/__pycache__

          rm -f package/${{ github.event.repository.name }}/sources.json

          cd package

          zip -r \
            ../${{ github.event.repository.name }}-${{ github.ref_name }}.zip \
            ${{ github.event.repository.name }}

      - name: Verify ZIP
        run: |
          echo "ZIP contents:"
          unzip -l ${{ github.event.repository.name }}-${{ github.ref_name }}.zip

          if unzip -l ${{ github.event.repository.name }}-${{ github.ref_name }}.zip | grep -q "sources.json"; then
            echo "ERROR: sources.json is included!"
            exit 1
          fi

          echo "ZIP verification passed."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.zip